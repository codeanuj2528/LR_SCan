<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LR Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 0.75rem;
            padding: 2rem 1rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2; /* Put it on top of icon and text for mobile touches */
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 1rem;
            border-radius: 0.5rem;
            display: none;
            object-fit: contain;
        }

        .spinner {
            display: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #status-message {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--primary-color);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LR Scanner</h1>
        <p>Take a photo or upload a Lorry Receipt. We'll extract the waybill number and generate a PDF.</p>

        <form id="upload-form">
            <div class="upload-area" id="drop-area">
                <div class="upload-icon">📸</div>
                <div>Tap to snap a photo or select an image</div>
                <input type="file" id="image-input" name="image" accept="image/*" required>
                <img id="preview" alt="Preview">
            </div>

            <button type="submit" id="submit-btn" class="btn">
                <div class="spinner" id="spinner"></div>
                <span id="btn-text">Scan and Convert</span>
            </button>
        </form>
        
        <div id="status-message">Processing... This might take a few seconds.</div>
    </div>

    <script>
        const imageInput = document.getElementById('image-input');
        const preview = document.getElementById('preview');
        const form = document.getElementById('upload-form');
        const submitBtn = document.getElementById('submit-btn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');
        const statusMessage = document.getElementById('status-message');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.querySelector('.upload-icon').style.display = 'none';
                    document.querySelector('.upload-area div:nth-child(2)').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // Client-side image compression to maximize network speed on mobile connections
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob(
                            (blob) => {
                                resolve(blob);
                            },
                            'image/jpeg',
                            quality
                        );
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const file = imageInput.files[0];
            if (!file) return;

            // Update UI to loading state immediately
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Compressing...';
            statusMessage.style.display = 'block';
            statusMessage.textContent = 'Preparing image for fast upload...';
            statusMessage.style.color = 'var(--primary-color)';

            try {
                // Compress image to max 1600px width/height, 80% quality (reduces size from 8MB to ~250KB in milliseconds!)
                const compressedBlob = await compressImage(file, 1600, 1600, 0.8);
                
                btnText.textContent = 'Uploading...';
                statusMessage.textContent = 'Uploading and scanning waybill number...';

                const formData = new FormData();
                formData.append('image', compressedBlob, 'receipt.jpg');

                const response = await fetch('/scan', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errorMessage = 'Scanning failed.';
                    try {
                        const errJson = await response.json();
                        if (errJson && errJson.message) {
                            errorMessage = errJson.message;
                        }
                    } catch (e) {
                        try {
                            const errText = await response.text();
                            if (errText) errorMessage = errText;
                        } catch (textErr) {}
                    }
                    throw new Error(errorMessage);
                }

                // Get the filename from the Content-Disposition header if possible
                let filename = 'LR_scanned.pdf';
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.indexOf('filename=') !== -1) {
                    const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                // Create a temporary link to trigger download
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                if (filename === 'LR_scanned.pdf') {
                    statusMessage.textContent = 'PDF generated! (LR number could not be read; saved as LR_scanned.pdf)';
                    statusMessage.style.color = '#f59e0b'; // Amber/Yellow
                } else {
                    statusMessage.textContent = `Success! Downloaded ${filename}`;
                    statusMessage.style.color = '#10b981'; // Green
                }

                // Reset preview and file input immediately so they can scan the next one!
                form.reset();
                preview.style.display = 'none';
                document.querySelector('.upload-icon').style.display = 'block';
                document.querySelector('.upload-area div:nth-child(2)').style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                statusMessage.textContent = error.message || 'An error occurred during scanning.';
                statusMessage.style.color = '#ef4444'; // Red
            } finally {
                // Enable button instantly so they can snap the next photo right away
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Scan and Convert';
                
                // Hide success or error status message after 7 seconds
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 7000);
            }
        });
    </script>
</body>
</html>
