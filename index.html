<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LR Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --surface-color: #151d30;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: rgba(59, 130, 246, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #24324f;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--surface-color);
            padding: 2.25rem 1.75rem;
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 10px 10px -5px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        /* Modern Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .action-card {
            background-color: var(--primary-light);
            border: 1.5px solid var(--border-color);
            border-radius: 0.85rem;
            padding: 1.25rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        .action-card:hover {
            border-color: var(--primary-color);
            background-color: rgba(59, 130, 246, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        
        .action-card:active {
            transform: translateY(0);
        }

        .action-card.secondary {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .action-card.secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05);
        }

        .action-icon {
            font-size: 2.25rem;
        }

        .action-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .action-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Image Preview Frame */
        .preview-frame {
            display: none;
            border: 1px dashed var(--border-color);
            border-radius: 0.85rem;
            padding: 0.5rem;
            margin-bottom: 1.5rem;
            background-color: rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #preview {
            max-width: 100%;
            max-height: 220px;
            border-radius: 0.6rem;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        /* Action Submit Button */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 650;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: none; /* Hidden until image is picked */
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            color: var(--text-muted);
            box-shadow: none;
            transform: none;
        }

        .spinner {
            display: none;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #status-message {
            margin-top: 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.4;
            color: var(--primary-color);
            display: none;
            padding: 0.5rem;
            border-radius: 0.5rem;
            animation: fadeIn 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LR Scanner</h1>
        <div class="subtitle">Select an option to scan your Lorry Receipt and instantly generate a PDF waybill.</div>

        <!-- Hidden inputs configured perfectly for both Camera and Gallery uploads -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
        <input type="file" id="gallery-input" accept="image/*" style="display:none;">

        <form id="upload-form">
            <!-- Modern Action Grid Buttons -->
            <div class="actions-grid" id="actions-container">
                <div class="action-card" id="camera-btn">
                    <span class="action-icon">📸</span>
                    <span class="action-title">Take Photo</span>
                    <span class="action-desc">Open phone camera</span>
                </div>
                <div class="action-card secondary" id="gallery-btn">
                    <span class="action-icon">📁</span>
                    <span class="action-title">Choose File</span>
                    <span class="action-desc">Upload from gallery</span>
                </div>
            </div>

            <!-- Receipt Preview frame -->
            <div class="preview-frame" id="preview-frame">
                <img id="preview" alt="LR Receipt Preview">
            </div>

            <!-- Submit Button (shown only after file selected) -->
            <button type="submit" id="submit-btn" class="btn">
                <div class="spinner" id="spinner"></div>
                <span id="btn-text">Scan and Convert</span>
            </button>
        </form>
        
        <div id="status-message">Processing... This might take a few seconds.</div>
    </div>

    <script>
        const cameraInput = document.getElementById('camera-input');
        const galleryInput = document.getElementById('gallery-input');
        const cameraBtn = document.getElementById('camera-btn');
        const galleryBtn = document.getElementById('gallery-btn');
        const previewFrame = document.getElementById('preview-frame');
        const preview = document.getElementById('preview');
        const form = document.getElementById('upload-form');
        const submitBtn = document.getElementById('submit-btn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');
        const statusMessage = document.getElementById('status-message');

        let selectedFile = null;

        // Trigger native device actions on card tap
        cameraBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        galleryBtn.addEventListener('click', () => {
            galleryInput.click();
        });

        // Capture files from camera input
        cameraInput.addEventListener('change', function(e) {
            handleFileSelection(e.target.files[0]);
        });

        // Capture files from gallery input
        galleryInput.addEventListener('change', function(e) {
            handleFileSelection(e.target.files[0]);
        });

        // Standardized File selection logic
        function handleFileSelection(file) {
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    previewFrame.style.display = 'block';
                    submitBtn.style.display = 'flex'; // Reveal the scan button!
                }
                reader.readAsDataURL(file);
            }
        }

        // Client-side image compression to maximize network speed on mobile connections
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob(
                            (blob) => {
                                resolve(blob);
                            },
                            'image/jpeg',
                            quality
                        );
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!selectedFile) return;

            // Update UI to loading state immediately
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Compressing...';
            statusMessage.style.display = 'block';
            statusMessage.textContent = 'Preparing image for fast upload...';
            statusMessage.style.color = 'var(--primary-color)';

            try {
                // Compress image to max 1600px width/height, 80% quality (reduces size from 8MB to ~250KB in milliseconds!)
                const compressedBlob = await compressImage(selectedFile, 1600, 1600, 0.8);
                
                btnText.textContent = 'Uploading...';
                statusMessage.textContent = 'Uploading and scanning waybill number...';

                const formData = new FormData();
                formData.append('image', compressedBlob, 'receipt.jpg');

                const response = await fetch('/scan', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errorMessage = 'Scanning failed.';
                    try {
                        const errJson = await response.json();
                        if (errJson && errJson.message) {
                            errorMessage = errJson.message;
                        }
                    } catch (e) {
                        try {
                            const errText = await response.text();
                            if (errText) errorMessage = errText;
                        } catch (textErr) {}
                    }
                    throw new Error(errorMessage);
                }

                // Get the filename from the Content-Disposition header if possible
                let filename = 'LR_scanned.pdf';
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.indexOf('filename=') !== -1) {
                    const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                // Create a temporary link to trigger download
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                if (filename === 'LR_scanned.pdf') {
                    statusMessage.textContent = 'PDF generated! (LR number could not be read; saved as LR_scanned.pdf)';
                    statusMessage.style.color = 'var(--accent-yellow)';
                } else {
                    statusMessage.textContent = `Success! Downloaded ${filename}`;
                    statusMessage.style.color = 'var(--accent-green)';
                }

                // Reset preview and state immediately so they can scan the next one!
                form.reset();
                selectedFile = null;
                previewFrame.style.display = 'none';
                submitBtn.style.display = 'none';
                cameraInput.value = '';
                galleryInput.value = '';

            } catch (error) {
                console.error('Error:', error);
                statusMessage.textContent = error.message || 'An error occurred during scanning.';
                statusMessage.style.color = 'var(--accent-red)';
            } finally {
                // Enable button instantly so they can snap the next photo right away
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Scan and Convert';
                
                // Hide success or error status message after 7 seconds
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 7000);
            }
        });
    </script>
</body>
</html>
